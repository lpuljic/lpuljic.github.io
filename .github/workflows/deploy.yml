name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [pixelarch-updated]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PIXELARCH_TOKEN }}

      - name: Update pixelarch submodule
        if: github.event_name == 'repository_dispatch'
        run: |
          git submodule update --remote pixelarch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pixelarch
          git diff --cached --quiet && exit 0
          git commit -m "bump pixelarch to $(git -C pixelarch rev-parse --short HEAD)"
          git push
        env:
          GH_TOKEN: ${{ secrets.PIXELARCH_TOKEN }}

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Generate git info
        run: |
          mkdir -p data
          echo '{"hash":"'$(git log --format='%h' -1)'","date":"'$(git log --format='%ci' -1 | cut -d' ' -f1)'"}' > data/git.json

      - name: Build site
        run: hugo --minify

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
